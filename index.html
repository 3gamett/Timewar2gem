<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時空戦記 Universal Engine (Expanded)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="header-title">
      <h1>時空戦記</h1>
      <div class="sub">Advanced Universal Engine</div>
    </div>
    <div class="log-nav">
      <button id="btnPrevTurn">◀︎</button>
      <span id="currentTurnLabel">Turn 0</span>
      <button id="btnNextTurn">▶︎</button>
    </div>
  </header>

  <main class="main-layout">
    <section class="panel log-panel">
      <div class="panel-head">
        <h2>戦闘ログ</h2>
        <div class="row">
          <button id="btnCopyLog">コピー</button>
          <button id="btnClearLog" class="danger">消去</button>
        </div>
      </div>
      <div class="battle-control-row">
        <button id="btnStart" class="primary">戦闘開始</button>
        <button id="btnNext">次へ</button>
        <button id="btnAuto">オート</button>
        <button id="btnStop">停止</button>
      </div>
      <div class="status-bar">
        <span id="turnBadge">Turn 0</span>
        <span id="phaseBadge">-</span>
        <span id="stateBadge">待機中</span>
      </div>
      <div id="logArea" class="log-area"><div id="logContent">準備完了。</div></div>
    </section>

    <section class="panel formation-panel">
      <div class="panel-head">
        <h2>軍団編成</h2>
        <button id="btnSyncFile">ファイルから同期</button>
      </div>
      
      <h3 class="team-label team-left">自軍 (Left)</h3>
      <div id="leftSlots" class="slots"></div>

      <h3 class="team-label team-right" style="margin-top:20px;">敵軍 (Right)</h3>
      <div id="rightSlots" class="slots"></div>
    </section>

    <section class="panel viewer-panel">
      <div class="panel-head"><h2>データ確認</h2></div>
      <div class="viewer-layout">
        <select id="heroViewerSelect"></select>
        <div id="heroViewerDetail" class="detail-box">英傑詳細</div>
        <select id="skillViewerSelect" style="margin-top:10px;"></select>
        <div id="skillViewerDetail" class="detail-box">スキル詳細</div>
      </div>
    </section>

    <section class="panel editor-panel">
      <div class="panel-head"><h2>英傑JSON</h2><button id="btnSaveHeroes">保存</button></div>
      <textarea id="heroesJson" spellcheck="false"></textarea>
    </section>
    <section class="panel editor-panel">
      <div class="panel-head"><h2>スキルJSON</h2><button id="btnSaveSkills">保存</button></div>
      <textarea id="skillsJson" spellcheck="false"></textarea>
    </section>
  </main>

  <div id="heroModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>英傑を選択</h2>
        <button class="close-btn" onclick="closeHeroModal()">&times;</button>
      </div>
      <div id="heroGrid" class="hero-grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
